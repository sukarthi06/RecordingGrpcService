name: CD API

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]

permissions:
  id-token: write
  contents: read

concurrency:
  group: recording-api-deploy
  cancel-in-progress: false

env:
  RESOURCE_GROUP: rg-stt
  APP_NAME: stt-recordingapi-dev
  IMAGE_NAME: recordingapi-comp
  DOCKERFILE: RecordingService.Api/Dockerfile
  TARGET_PORT: "8080"

jobs:
  deploy:
    name: Deploy Recording API to Azure Container App
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Log source checkout status
        run: |
          echo "::notice title=Checkout completed::Deploying commit $(git rev-parse --short HEAD)."

      - name: Azure login
        uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Log Azure login status
        run: |
          subscription="$(az account show --query name --output tsv)"
          echo "::notice title=Azure login completed::Authenticated to subscription: $subscription."

      - name: Build and push image to ACR
        run: |
          az acr login --name ${{ vars.ACR_NAME }} --resource-group $RESOURCE_GROUP
          docker buildx build -f $DOCKERFILE \
            -t ${{ vars.ACR_LOGIN_SERVER }}/$IMAGE_NAME:${{ github.event.workflow_run.head_sha }} \
            --push .
          echo "::notice title=Container image published::Image pushed to ACR for commit ${{ github.event.workflow_run.head_sha }}."

      - name: Wait for any active Container App operation
        run: |
          for attempt in {1..60}; do
            state="$(az containerapp show --name $APP_NAME --resource-group $RESOURCE_GROUP --query properties.provisioningState --output tsv)"
            case "$state" in
              Succeeded) echo "::notice title=Container App ready::No active Container App operation."; exit 0 ;;
              Failed) echo "::warning title=Previous operation failed::Continuing with this corrective deployment."; exit 0 ;;
              *) echo "Container App provisioning state: $state. Waiting..."; sleep 10 ;;
            esac
          done
          echo "Timed out waiting for the Container App to become ready."
          exit 1

      - name: Set Container App secrets
        env:
          RECORDING_DB_CONNECTION_STRING: ${{ secrets.RECORDING_DB_CONNECTION_STRING }}
          STORAGE_CONNECTION_STRING: ${{ secrets.STORAGE_CONNECTION_STRING }}
          OTLP_HEADERS: ${{ secrets.GRAFANA_OTLP_AUTH_HEADER }}
        run: |
          az containerapp secret set \
            --name $APP_NAME \
            --resource-group $RESOURCE_GROUP \
            --secrets \
              "recordingdb-connection=$RECORDING_DB_CONNECTION_STRING" \
              "storage-connection=$STORAGE_CONNECTION_STRING" \
              "otlp-headers=$OTLP_HEADERS" \
            --output none
          echo "::notice title=Secrets updated::recordingdb-connection, storage-connection and otlp-headers secrets were updated."

      - name: Wait for secret update
        run: |
          sleep 15
          state="$(az containerapp show --name $APP_NAME --resource-group $RESOURCE_GROUP --query properties.provisioningState --output tsv)"
          echo "::notice title=Secret update check::Container App provisioning state: $state."

      - name: Connect ACR with managed identity
        run: |
          az containerapp registry set \
            --name $APP_NAME \
            --resource-group $RESOURCE_GROUP \
            --server ${{ vars.ACR_LOGIN_SERVER }} \
            --identity system \
            --output none
          echo "::notice title=Registry connected::ACR ${{ vars.ACR_LOGIN_SERVER }} is configured with the system-assigned identity."

      - name: Set ingress target port
        run: |
          current_port="$(az containerapp show --name $APP_NAME --resource-group $RESOURCE_GROUP --query properties.configuration.ingress.targetPort --output tsv)"
          if [[ "$current_port" != "$TARGET_PORT" ]]; then
            az containerapp ingress update \
              --name $APP_NAME \
              --resource-group $RESOURCE_GROUP \
              --target-port $TARGET_PORT \
              --output none
            echo "::notice title=Ingress updated::Target port changed from $current_port to $TARGET_PORT."
          else
            echo "::notice title=Ingress unchanged::Target port is already $TARGET_PORT."
          fi

      - name: Deploy to Container App
        env:
          OTLP_ENDPOINT: ${{ vars.OTLP_ENDPOINT }}
          OTLP_PROTOCOL: ${{ vars.OTLP_PROTOCOL }}
        run: |
          az containerapp update \
            --name $APP_NAME \
            --resource-group $RESOURCE_GROUP \
            --image ${{ vars.ACR_LOGIN_SERVER }}/$IMAGE_NAME:${{ github.event.workflow_run.head_sha }} \
            --set-env-vars \
              "ASPNETCORE_ENVIRONMENT=UAT" \
              "ConnectionStrings__RecordingDb=secretref:recordingdb-connection" \
              "Azure__StorageConnectionString=secretref:storage-connection" \
              "Otlp__Endpoint=$OTLP_ENDPOINT" \
              "Otlp__Protocol=$OTLP_PROTOCOL" \
              "Otlp__TracesEndpoint=${OTLP_ENDPOINT%/}/v1/traces" \
              "Otlp__MetricsEndpoint=${OTLP_ENDPOINT%/}/v1/metrics" \
              "Otlp__Headers=secretref:otlp-headers" \
            --output none
          echo "::notice title=Container App deployment completed::Azure accepted and completed the image update."

      - name: Verify deployed revision
        run: |
          set -euo pipefail

          app="$APP_NAME"
          rg="$RESOURCE_GROUP"
          expected_image="${{ vars.ACR_LOGIN_SERVER }}/$IMAGE_NAME:${{ github.event.workflow_run.head_sha }}"

          for attempt in {1..60}; do
            app_state="$(az containerapp show \
              --name "$app" \
              --resource-group "$rg" \
              --query properties.provisioningState \
              --output tsv)"

            revision="$(az containerapp show \
              --name "$app" \
              --resource-group "$rg" \
              --query properties.latestReadyRevisionName \
              --output tsv)"

            if [[ "$app_state" == "Succeeded" && -n "$revision" ]]; then
              details="$(az containerapp revision show \
                --name "$app" \
                --resource-group "$rg" \
                --revision "$revision" \
                --query '{active:properties.active,health:properties.healthState,provisioning:properties.provisioningState,image:properties.template.containers[0].image}' \
                --output json)"

              echo "$details"

              actual_image="$(echo "$details" | jq -r .image)"
              health="$(echo "$details" | jq -r .health)"
              provisioning="$(echo "$details" | jq -r .provisioning)"

              if [[ "$actual_image" == "$expected_image" && "$health" == "Healthy" && "$provisioning" == "Provisioned" ]]; then
                echo "::notice title=Deployment verified::Revision $revision is active, healthy, provisioned, and running the expected image."
                exit 0
              fi
            fi

            sleep 10
          done

          echo "Deployment verification timed out."
          exit 1